name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings rather than letting them accumulate into noise
  # nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  # The engine crates carry no GTK dependency by design, so they build and test
  # without a display server or any system development packages. Keeping this
  # job separate means a UI toolchain problem never masks a git-engine failure.
  engine:
    name: engine (git, auth, db, github)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p git -p auth -p db -p github --all-targets

      - name: Test
        run: cargo test -p git -p auth -p db -p github

  # The memory budget is forqen's differentiating claim. A claim nobody
  # measures rots within a sprint, so it gates every pull request.
  memcheck:
    name: memory budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Scroll a 20k-commit history under budget
        run: cargo test -p git --test memcheck --release -- --nocapture

  ui:
    name: ui + app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p ui -p app --all-targets

      - name: Build
        run: cargo build --workspace

  # Packaging validation, deliberately not on every push.
  #
  # A Flatpak build downloads ~1GB of GNOME SDK and compiles the whole
  # dependency tree inside the sandbox — several minutes and a lot of bandwidth
  # to re-prove something that only changes when the manifest does. Runs on
  # tags and on demand.
  #
  # No container image: bilelmoussaoui/flatpak-github-actions publishes tags up
  # to gnome-47, and this manifest targets runtime 50, so flatpak is installed
  # on the runner instead and the SDK comes from flathub.
  # Packaging is validated on every push to main, not only at release.
  #
  # It broke four separate ways the first time it was run for real — a runtime
  # version that did not exist, git failing to compile under GCC 15, no
  # vendored crates in a sandbox with no network, and an AppStream step that
  # could not read an SVG-only icon. None of those were visible from the Rust
  # build. Finding them at tag time would mean finding them under pressure.
  flatpak:
    name: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and the builder
        run: |
          sudo apt-get update
          # elfutils supplies eu-strip, which flatpak-builder runs to split
          # debuginfo out of every binary. It is present on most desktops and
          # absent on GitHub runners, where the build otherwise gets all the
          # way through compiling git and then dies on a missing executable.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # The SDK and platform are ~1.5GB and change only when the manifest
      # pins a new runtime, so they are keyed on the manifest itself.
      - name: Cache the flatpak installation
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ hashFiles('build-aux/io.github.forqen.Forqen.yml') }}
          restore-keys: flatpak-runtimes-

      - name: Install the runtime, SDK and rust extension
        run: |
          flatpak install --user --noninteractive --no-static-deltas flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - uses: dtolnay/rust-toolchain@stable

      # vendor/ is gitignored — 437MB has no business in the repository — and
      # the build sandbox has no network, so without this cargo cannot resolve
      # a single dependency.
      - name: Vendor crates for the offline sandbox
        run: cargo vendor --versioned-dirs vendor

      # Incremental across runs: git and the crate tree only rebuild when the
      # manifest or the sources they come from change.
      - name: Cache the build state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-build-${{ hashFiles('build-aux/**', 'Cargo.lock') }}
          restore-keys: flatpak-build-

      - name: Build into a local repository
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build build-aux/io.github.forqen.Forqen.yml

      # A bundle anyone can download from the run and install with
      # `flatpak install forqen.flatpak` — the thing that proves packaging
      # actually produced something installable.
      - name: Export a bundle
        run: |
          flatpak build-bundle repo forqen.flatpak io.github.forqen.Forqen master
          ls -lh forqen.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: forqen-flatpak
          path: forqen.flatpak
          retention-days: 14
