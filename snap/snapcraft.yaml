name: forqen
base: core24
version: '0.1.0'
summary: Native GitHub client for Linux
description: |
  forqen is a native GTK4 client for git and github.com: history browsing,
  hunk- and line-level staging, conflict resolution, interactive rebase,
  pull request review, issues, notifications and Actions.

  It is written in Rust and holds a flat memory curve over large histories —
  scrolling the whole of git.git costs under two megabytes of resident memory,
  because commit rows are realized only for the visible window.

grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:

apps:
  forqen:
    command: usr/bin/forqen
    common-id: space.daystack.Forqen
    desktop: usr/share/applications/space.daystack.Forqen.desktop
    extensions: [gnome]
    environment:
      # glibc opens a per-thread arena on first allocation from each thread and
      # never returns them; on a rayon pool that inflates RSS by tens of
      # megabytes for no data reason. The flatpak wrapper sets the same value.
      MALLOC_ARENA_MAX: '2'
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
      GIT_TEMPLATE_DIR: $SNAP/usr/share/git-core/templates
    plugs:
      - network
      - home
      - removable-media
      # Token storage. forqen refuses to write tokens to disk in plaintext, so
      # with no Secret Service reachable it cannot sign in at all.
      - password-manager-service
      # Everything below is outside the `home` interface, which grants only
      # non-hidden top-level paths. A git client that cannot read ~/.gitconfig
      # does not know the user's name, and one that cannot read ~/.ssh cannot
      # push. Both require Snap Store manual review.
      - dot-gitconfig
      - dot-ssh

plugs:
  dot-gitconfig:
    interface: personal-files
    read:
      - $HOME/.gitconfig
      - $HOME/.config/git
  dot-ssh:
    interface: personal-files
    read:
      - $HOME/.ssh

parts:
  forqen:
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
      - -Dprofile=release
    build-packages:
      - curl
      - libgtk-4-dev
      - libadwaita-1-dev
      - libgtksourceview-5-dev
      - libssl-dev
      - pkg-config
      - git

    # `craftctl default` re-enters craft-parts, which constructs its own
    # environment rather than inheriting the override-build shell's. A PATH
    # exported above therefore never reaches meson, which then cannot find
    # rustc. Declaring it here puts it in the part's environment instead.
    build-environment:
      - CARGO_HOME: ${CRAFT_PART_BUILD}/.cargo
      - RUSTUP_HOME: ${CRAFT_PART_BUILD}/.rustup
      - PATH: ${CRAFT_PART_BUILD}/.cargo/bin:${PATH}

    override-build: |
      # core24 is Ubuntu 24.04, whose archive rustc is older than this
      # workspace's rust-version, so the toolchain has to come from elsewhere.
      #
      # Not the rustup snap: the gnome extension puts the GNOME SDK's libc on
      # LD_LIBRARY_PATH for the build, the rustup snap is linked against a
      # different one, and it dies on an undefined GLIBC_PRIVATE symbol before
      # running a single command.
      #
      # Not `curl | sh` either: that executes whatever the host serves, at a
      # version nobody chose, inside a build that produces a signed artifact.
      # The installer is pinned and its checksum verified before it runs.
      curl -sSfL -o rustup-init \
        https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
      echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  rustup-init" \
        | sha256sum --check --strict -
      chmod +x rustup-init
      ./rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.97.0
      rm rustup-init
      craftctl default

  # forqen drives the git binary for rebase, signed commits, hook-running
  # commits and transport. Under confinement the host's git is not on PATH, so
  # it ships inside the snap.
  git:
    plugin: nil
    stage-packages:
      - git
      - git-lfs
